name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/sync-hf-space.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build sync payload (exclude large training artifacts)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          rm -rf .hf-sync .hf-space-current
          mkdir -p .hf-sync

          cp -R backend/. .hf-sync/

          # Keep only essential runtime models, remove training artifacts
          # Remove unused keras files, notebooks, and large FFPP model.safetensors (can download on first run via HF fallback)
          rm -f .hf-sync/trained_models/*.keras
          rm -f .hf-sync/trained_models/Colab*.ipynb
          rm -f .hf-sync/trained_models/*threshold*.json
          rm -f .hf-sync/trained_models/model.safetensors
          rm -f .hf-sync/trained_models/training_args.bin

          # Explicitly clone icpr2020dfdc because it is in .gitignore and missing from the GH runner
          if [ ! -d .hf-sync/models/icpr2020dfdc ]; then
            git clone https://github.com/polimi-ispl/icpr2020dfdc.git .hf-sync/models/icpr2020dfdc
            # Remove its .git folder so HF doesn't treat it as a submodule
            rm -rf .hf-sync/models/icpr2020dfdc/.git
          fi
      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: ar07xd/deepshield
          repo_type: space
          space_sdk: docker
          hf_token: ${{ secrets.HF_TOKEN }}
          subdirectory: .hf-sync
