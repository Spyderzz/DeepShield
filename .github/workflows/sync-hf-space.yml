name: Sync Backend to Hugging Face Space

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/sync-hf-space.yml"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Build sync payload (exclude large training artifacts)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          rm -rf .hf-sync .hf-space-current
          mkdir -p .hf-sync

          cp -R backend/. .hf-sync/

          # Remove trained_models from payload — models stay on HF Space untouched
          rm -rf .hf-sync/trained_models/

          # Explicitly clone icpr2020dfdc because it is in .gitignore and missing from the GH runner
          if [ ! -d .hf-sync/models/icpr2020dfdc ]; then
            git clone https://github.com/polimi-ispl/icpr2020dfdc.git .hf-sync/models/icpr2020dfdc
            # Remove its .git folder so HF doesn't treat it as a submodule
            rm -rf .hf-sync/models/icpr2020dfdc/.git
          fi
      - name: Install Hugging Face CLI
        run: pip install -U huggingface_hub

      - name: Sync to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Use huggingface-cli to upload the .hf-sync folder contents to the Space root.
          # Unlike the previous tool, this is an "Update" operation, not a "Mirror"
          # so it will NOT delete your existing models on HF Space.
          huggingface-cli upload ar07xd/deepshield .hf-sync/ . \
            --repo-type=space \
            --token=$HF_TOKEN \
            --message "Sync from GitHub (Code Only)" \
            --ignore-patterns "trained_models/*"
